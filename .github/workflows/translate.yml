name: Translate

# English and Simplified Chinese pages are written by hand. When they change on main, this
# translates the other languages with scripts/i18n/translate.mjs and commits the result to main,
# which Mintlify then deploys. Only pages that are missing or whose source changed are
# translated. The product's interface translations are checked out beside the site, as the
# script reads its labels from ../molesignal.
#
# Needs the secret OPENAI_API_KEY and the variable TRANSLATE_MODEL; the variable OPENAI_BASE_URL
# points it at another OpenAI-compatible service.

on:
  # Starts on the hand-written English and Simplified Chinese text: the pages, their navigation
  # in docs.json, and the translation scripts. docs.json also holds the other languages'
  # navigation and the site's settings, so the job `changes` below compares the en and zh-Hans
  # navigation itself.
  push:
    branches: [main]
    paths:
      - 'en-US/**.mdx'
      - 'zh-Hans/**.mdx'
      - 'docs.json'
      - 'scripts/i18n/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  changes:
    name: Look for changed source text
    runs-on: ubuntu-latest
    outputs:
      translate: ${{ steps.look.outputs.translate }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - id: look
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A manual run, or a push whose previous commit is unknown, always translates.
          if [ "$EVENT" != push ] || [ -z "${BEFORE//0/}" ] || ! git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
            echo 'translate=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$BEFORE" "$AFTER" -- 'en-US/*.mdx' 'zh-Hans/*.mdx' scripts/i18n)
          nav() {
            git show "$1:docs.json" | jq -S '[.navigation.languages[] | select(.language == "en" or .language == "zh-Hans")]'
          }

          if [ "$(nav "$BEFORE")" != "$(nav "$AFTER")" ]; then
            files=$(printf '%s\n' "$files" 'docs.json (en or zh-Hans navigation)')
          fi

          files=$(printf '%s\n' "$files" | grep -v '^$' || true)
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | head -20
            echo 'translate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No English or Simplified Chinese text changed.'
            echo 'translate=false' >> "$GITHUB_OUTPUT"
          fi

  translate:
    name: Translate
    needs: changes
    if: ${{ needs.changes.outputs.translate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: docs
      - uses: actions/checkout@v5
        with:
          repository: molesignal/molesignal
          path: molesignal
          sparse-checkout: web/src/i18n
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Translate the pages
        working-directory: docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: node scripts/i18n/translate.mjs --concurrency=8

      - name: Commit the translations
        # Runs even when some pages failed, so the pages that were translated are kept.
        if: ${{ !cancelled() }}
        working-directory: docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'docs: update machine translations'
          # Another push may have landed while this ran.
          git pull --rebase origin main
          git push origin HEAD:main
